
# ragbench (~/code/ragbench, design v3: every pod is one single-threaded
# gunicorn process on one core; scenarios differ only in pods per service).
#
# Service times: one Gaussian per service, fitted (mean, sd) on the
# baseline's 1-RPS traces of the 2026-10-12 testbed collection
# (ragbench/data_v3_20261012/baseline/traces_1RPS.json, 301 requests): the
# sum of each service's self segments (muBench compute_pi + framework).
# Hops: one Gaussian for every leg (request or response), fitted on the
# same traces (mean 1.17 ms over all legs).
#
# Topology: the gateway does its own work, then calls embedder (which
# calls vector-search), reranker and llm-generate one after the other,
# holding its process until they return (nested `calls`). guardrail is
# left out: in ragbench it runs in parallel with that whole sequence
# (~55 ms vs ~350 ms), so it never changes the response time, and
# KubeTwin's nested calls are sequential only.
#
# Knobs (environment): RAGBENCH_SCENARIO = baseline (default),
# baseline_repeat, llm_3, reranker_3, gateway_6; RAGBENCH_RPS (default 4).
# Arrivals are constant-rate, like k6's constant-arrival-rate executor.
#
#   bundle exec ruby -Ilib bin/kube_twin examples/ragbench.conf
#   bundle exec ruby -Ilib bin/ragbench_comparison <ragbench data dir>

ragbench_rps = (ENV['RAGBENCH_RPS'] || 4).to_f
ragbench_replicas = {
	'gateway' => 8, 'embedder' => 3, 'vector-search' => 1,
	'reranker' => 2, 'llm-generate' => 2,
}
case ENV['RAGBENCH_SCENARIO'] || 'baseline'
when 'baseline', 'baseline_repeat' then nil
when 'llm_3' then ragbench_replicas['llm-generate'] = 3
when 'reranker_3' then ragbench_replicas['reranker'] = 3
when 'gateway_6' then ragbench_replicas['gateway'] = 6
else raise "unknown RAGBENCH_SCENARIO #{ENV['RAGBENCH_SCENARIO']}"
end

start_time DateTime.civil(2020,5,28,0,0,0).to_time
# like a ragbench level: 30 s warm-up, 300 s measured
warmup_duration 30.seconds
cooldown_duration 10.seconds
duration 340.seconds
seeds communication_latencies: 12345
stats_print_interval 1

seed 12345

clusters \
	one: {
		name: "cluster1",
		location_id: 0,
		type: :mec,
		tier: "local",
		node_number: 1,
		node_resources_cpu: 28000,
		node_resources_memory: 64000,
	}

latency_models \
	[
		[
			{ distribution: :gaussian, args: { mean: 0.00117, sd: 0.0003 } },
		],
	]

customers \
	1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "gateway",
				calls: [
					{
						name: "embedder",
						calls: [
							{ name: "vector-search" }
						]
					},
					{ name: "reranker" },
					{ name: "llm-generate" }
				]
			}
		]
	}

request_gen \
	1 => {
		workflow_types: 1,
		starting_time: start_time,
		request_distribution: { distribution: :constant, args: { value: 1.0 / ragbench_rps } },
		num_requests: (ragbench_rps * 340).ceil,
		num_customers: 1
	}

# one process per pod (max_processes 1), one core (1000 millicores)
microservice_types \
	"gateway" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05419, sd: 0.00318, seed: seed } },
		},
		:resources_requirements_cpu => 1000,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"embedder" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.06496, sd: 0.00404, seed: seed } },
		},
		:resources_requirements_cpu => 1000,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"vector-search" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05223, sd: 0.00240, seed: seed } },
		},
		:resources_requirements_cpu => 1000,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"reranker" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.08255, sd: 0.00370, seed: seed } },
		},
		:resources_requirements_cpu => 1000,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"llm-generate" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.15130, sd: 0.00438, seed: seed } },
		},
		:resources_requirements_cpu => 1000,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	}

services \
	'gateway' => { serviceName: 'gateway', selector: 'gateway' },
	'embedder' => { serviceName: 'embedder', selector: 'embedder' },
	'vector-search' => { serviceName: 'vector-search', selector: 'vector-search' },
	'reranker' => { serviceName: 'reranker', selector: 'reranker' },
	'llm-generate' => { serviceName: 'llm-generate', selector: 'llm-generate' }

replica_sets \
	'rs-gateway' => { name: 'rs-gateway', selector: 'gateway', replicas: ragbench_replicas['gateway'] },
	'rs-embedder' => { name: 'rs-embedder', selector: 'embedder', replicas: ragbench_replicas['embedder'] },
	'rs-vector-search' => { name: 'rs-vector-search', selector: 'vector-search', replicas: ragbench_replicas['vector-search'] },
	'rs-reranker' => { name: 'rs-reranker', selector: 'reranker', replicas: ragbench_replicas['reranker'] },
	'rs-llm-generate' => { name: 'rs-llm-generate', selector: 'llm-generate', replicas: ragbench_replicas['llm-generate'] }

evaluation \
cluster_hourly_cost: [
	{ cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
	500.0 if general_stats.mean > 1.000
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['gateway', 'embedder', 'vector-search', 'reranker', 'llm-generate'],
		targets: []
	}
]
