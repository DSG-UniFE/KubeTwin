
# Same as examples/bookinfo_with_limits.conf, but mdn_file points at MDNs
# trained on LOCAL RPS (the causal, 10s-sliding-window rate actually
# observed at each microservice's own arrival stream - the same quantity
# Container#current_rps computes at simulation time) instead of the
# nominal RPS a trace file was collected at.
#
# OPTIMUUM-estensioni/bookinfo_with_limits/local_rps_diagnostic.py found
# local RPS is a consistent ~30-40% of nominal from RPS=10 up (e.g.
# nominal=120 -> local mean~37.3) - the same gap found on the original
# no-limits Bookinfo dataset, most likely from the load client's own
# closed-loop pacing. Training on nominal RPS means the MDN's own
# conditioning variable doesn't match what the simulator queries it with
# at inference time (current_rps is itself local) - this config fixes
# that mismatch.
#
# Because this MDN was trained on local RPS values that topped out around
# ~53 even at nominal=120, this config must be driven at the *local* rate
# for a fair comparison against real data, not the nominal one - see
# bin/generate_bookinfo_local_rps_comparison (NOT generate_bookinfo_rps_
# comparison, which would drive the open-loop simulator at up to 120 rps,
# far outside this model's training range, while comparing against real
# data that only ever experienced ~37 rps at that nominal label).

start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 10000.seconds
seeds communication_latencies: 12345
stats_print_interval 1

seed 12345

clusters \
	one: {
		name: "cluster1",
		location_id: 0,
		type: :mec,
		tier: "local",
		node_number: 1,
		node_resources_cpu: 8000,
		node_resources_memory: 31000,
	}

latency_models \
	[
		[
			{ distribution: :gaussian, args: { mean: 0.0005, sd: 0.0002 } },
		],
	]

customers \
    1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "productpage",
				calls: [
					{ name: "details" },
					{
						name: "reviews",
						calls: [
							{ name: "ratings" }
						]
					}
				]
			}
		]
	}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 40, seed: seed }},
    num_requests: 10_000,
    num_customers: 1
}

microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.0206, sigma: 0.6006, seed: seed}}, # unused, mdn_file takes priority
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:node_affinity=>"local",
		:mdn_file=>"./mdn_models/bookinfo_limits_productpage_local_rps_weights.json",
		:rps_correction_factor=>1.0,
		:rps=>5,
		:max_processes=>200,
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.1469, sigma: 1.1626, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>100,
		:mdn_file=>"./mdn_models/bookinfo_limits_details_local_rps_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>5,
		:max_processes=>200,
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.1976, sigma: 0.9960, seed: seed}},
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:mdn_file=>"./mdn_models/bookinfo_limits_reviews_local_rps_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>5,
		:max_processes=>200,
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.9735, sigma: 0.6140, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>50,
		:mdn_file=>"./mdn_models/bookinfo_limits_ratings_local_rps_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>5,
		:max_processes=>200,
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage'
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details'
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews'
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings'
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 1,
	},
	'app2' => {
		name: 'app2',
		selector: 'details',
		replicas: 1,
	},
	'app3' => {
		name: 'app3',
		selector: 'reviews',
		replicas: 1,
	},
	'app4' => {
		name: 'app4',
		selector: 'ratings',
		replicas: 1,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    500.0 if general_stats.mean > 0.500
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['productpage', 'details', 'reviews', 'ratings'],
		targets: []
	}
]
