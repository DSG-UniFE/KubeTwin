
start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 100000.seconds
seeds \
	{communication_latencies 12345}
stats_print_interval 1

seed 12345
 
federation \
'{
	"resources": {
		"cluster1": {
			"cpu": "7000",
			"mem": "4096",
			"num_nodes": 1,
			"nodes": [
				{
					"node": "cluster1",
					"cpu": "7000",
					"mem": "4096"
				}
			]
		},
		"cluster2edge": {
			"cpu": "7000",
			"mem": "8192"
		},
		"cluster3edge": {
			"cpu": "7000",
			"mem": "8192"
		}
	},
	"latencies": [
		{
			"src": "cluster1",
			"dst": "cluster2edge",
			"value": "0.030"
		},
		{
			"src": "cluster1",
			"dst": "cluster3edge",
			"value": "0.050"
		}
	]
}'


customers \
    1 => { location_id: 0 }
    
workflow_types \
	1 => {
		component_sequence: [
			{ name: "productpage" },
			{ name: "reviews" },
			{ name: "ratings" },
		] 
	}#,
	#2 => {
	#	component_sequence: [
	#		{ name: "reviews" },
	#		{ name: "ratings" },
	#	] 
	#}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 30, seed: seed }},
    num_requests: 10000,
    num_customers: 1
}

microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.9863, sigma: 0.4237, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-3.9863, :sigma=>0.4237, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded 
		:mdn_file=>"./mdn_models/productpage_weights.json",
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.7953, sigma: 0.66, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-5.7953, :sigma=>0.66, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>400,
		:resources_requirements_memory=>100,
		:mdn_file=>"./mdn_models/reviews_weights.json",
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -7.2518, sigma: 0.4921, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-7.2518, :sigma=>0.4921, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:mdn_file=>"./mdn_models/ratings_weights.json",
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -4.2602, sigma: 0.7735, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-4.2602, :sigma=>0.7735, :seed=>12345}} # at the moment is hardocoded
		},
		:mdn_file=>"./mdn_models/details_weights.json",
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage' # the selector name is the same of the service name
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews' # the selector name is the same of the service name
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings' # the selector name is the same of the service name
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details' # the selector name is the same of the service name
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 1,
	},
	'app2' => {
		name: 'app2',
		selector: 'reviews',
		replicas: 1,
	},
	'app3' => {
		name: 'app3',
		selector: 'ratings',
		replicas: 1,
	},
	'app4' => {
		name: 'app4',
		selector: 'details',
		replicas: 1,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cloud_control_plane, fixed_cpu_hourly_cost: 0.080, fixed_memory_hourly_cost: 0.070 },
    { cluster: :rome, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
    { cluster: :milan, fixed_cpu_hourly_cost: 0.120, fixed_memory_hourly_cost: 0.100 },
    { cluster: :paris, fixed_cpu_hourly_cost: 0.110, fixed_memory_hourly_cost: 0.090 },
    { cluster: :berlin, fixed_cpu_hourly_cost: 0.130, fixed_memory_hourly_cost: 0.110 },
    { cluster: :madrid, fixed_cpu_hourly_cost: 0.150, fixed_memory_hourly_cost: 0.120 },
    { cluster: :athens, fixed_cpu_hourly_cost: 0.170, fixed_memory_hourly_cost: 0.140 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    # 500$ penalties if MTTR takes more than 50 msecs
    500.0 if general_stats.mean > 0.500
}
    
policies [
	# Policy: optimize_productpage_chain (type: torch.policies.Placement.ServiceChainResponseTime)
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 3000},
		chains: ['productpage', 'reviews', 'ratings'],
		targets: []
	},
	# Policy: optimize_reviews_chain (type: torch.policies.Placement.ServiceChainResponseTime)
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 2500},
		chains: ['reviews', 'ratings'],
		targets: []
	},
	# Policy: required_availability (type: torch.policies.ApplicationService.Performance.Availability)
	{
		type: 'torch.policies.ApplicationService.Performance.Availability',
		properties: {'target_availability_percentage': 99.999},
		targets: []
	}
]

