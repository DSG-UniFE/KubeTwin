
# Same as examples/bookinfo_with_limits.conf, but with mdn_file pointing at
# the per-RPS-level log-normal fit (KUBETWIN::LogNormalMDN) instead of the
# MDN - a comparison config, not a replacement. See
# OPTIMUUM-estensioni/bookinfo_with_limits/fit_lognorm_per_rps.py for why:
# Bookinfo's bimodality check found no multi-modal tail, so a single
# log-normal per RPS level (fit by direct MLE, linearly interpolated
# between levels) may fit as well or better than a full 5-component MDN,
# with far fewer parameters (26 numbers vs a 35k-parameter network).

start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 10000.seconds
seeds communication_latencies: 12345
stats_print_interval 1

seed 12345

clusters \
	one: {
		name: "cluster1",
		location_id: 0,
		type: :mec,
		tier: "local",
		node_number: 1,
		node_resources_cpu: 8000,
		node_resources_memory: 31000,
	}

latency_models \
	[
		[
			{ distribution: :gaussian, args: { mean: 0.0005, sd: 0.0002 } },
		],
	]

customers \
    1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "productpage",
				calls: [
					{ name: "details" },
					{
						name: "reviews",
						calls: [
							{ name: "ratings" }
						]
					}
				]
			}
		]
	}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 40, seed: seed }},
    num_requests: 10_000,
    num_customers: 1
}

microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.0206, sigma: 0.6006, seed: seed}}, # unused, mdn_file takes priority
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:node_affinity=>"local",
		:mdn_file=>"./mdn_models/bookinfo_limits_productpage_lognorm.json",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.1469, sigma: 1.1626, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>100,
		:mdn_file=>"./mdn_models/bookinfo_limits_details_lognorm.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.1976, sigma: 0.9960, seed: seed}},
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:mdn_file=>"./mdn_models/bookinfo_limits_reviews_lognorm.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.9735, sigma: 0.6140, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>50,
		:mdn_file=>"./mdn_models/bookinfo_limits_ratings_lognorm.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage'
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details'
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews'
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings'
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 1,
	},
	'app2' => {
		name: 'app2',
		selector: 'details',
		replicas: 1,
	},
	'app3' => {
		name: 'app3',
		selector: 'reviews',
		replicas: 1,
	},
	'app4' => {
		name: 'app4',
		selector: 'ratings',
		replicas: 1,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    500.0 if general_stats.mean > 0.500
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['productpage', 'details', 'reviews', 'ratings'],
		targets: []
	}
]
