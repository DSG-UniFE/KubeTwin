
# TeaStore (DescartesResearch) configuration, matching the CPU-bound testbed
# collected on a Docker Compose deployment (single instance per service,
# 2-core CPU limit each, matching the methodology in Eismann et al.,
# "Microservices: A Performance Tester's Dream or Nightmare?", ICPE 2020).
#
# Workflow topology is the TeaStore "index"/browse page load: webui receives
# the external request and, within handling it, calls persistence (category
# listing), auth (login-state check) and image (product images) - evidenced
# directly from a Kieker trace of IndexServlet.handleGETRequest calling
# LoadBalancedCRUDOperations.getEntities, LoadBalancedStoreOperations.isLoggedIn
# and LoadBalancedImageOperations.getWebImages within one traceId. recommender
# is excluded: it was called too rarely in our traces (23 samples total) to
# train a usable MDN for it.
#
# request_gen below targets 30 RPS, one of the 7 balanced levels collected on
# the testbed (see /Users/filippopoltronieri/Downloads/OPTIMUUM-estensioni/teastore_extraction/),
# so results can be compared directly against that run's real aggregates.
# Swap request_distribution's :rate (and re-point mdn RPS expectations aren't
# needed - the simulator estimates its own live RPS) to compare at 1/10/60/100/150/200.

start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 10000.seconds
seeds communication_latencies: 12345
stats_print_interval 1

seed 12345

federation \
'{
	"resources": {
		"cluster1": {
			"cpu": "8000",
			"mem": "31000",
			"num_nodes": 1,
			"nodes": [
				{
					"node": "cluster1",
					"cpu": "8000",
					"mem": "31000"
				}
			]
		}
	},
	"latencies": []
}'

customers \
    1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "webui",
				calls: [
					{ name: "persistence" },
					{ name: "auth" },
					{ name: "image" }
				]
			}
		]
	}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 30, seed: seed }},
    num_requests: 10000,
    num_customers: 1
}

microservice_types \
	"webui" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -4.0, sigma: 0.5, seed: seed}}, # unused, mdn_file takes priority
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-4.0, :sigma=>0.5, :seed=>12345}}
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>2000,
		:node_affinity=>"local",
		:mdn_file=>"./mdn_models/teastore_webui_weights.json",
		:rps_correction_factor=>1.0,
		:rps=>30,
		:max_processes=>200, # matches Tomcat's default maxThreads - real TeaStore serves many requests concurrently per instance, not serially
	},
	"auth" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.0, sigma: 0.5, seed: seed}},
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-6.0, :sigma=>0.5, :seed=>12345}}
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>1000,
		:mdn_file=>"./mdn_models/teastore_auth_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>30,
		:max_processes=>200,
	},
	"image" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -7.0, sigma: 0.5, seed: seed}},
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-7.0, :sigma=>0.5, :seed=>12345}}
		},
		:mdn_file=>"./mdn_models/teastore_image_weights.json",
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>1500,
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>30,
		:max_processes=>200,
	},
	"persistence" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.5, sigma: 0.5, seed: seed}},
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-6.5, :sigma=>0.5, :seed=>12345}}
		},
		:mdn_file=>"./mdn_models/teastore_persistence_weights.json",
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>1000,
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>30,
		:max_processes=>200,
	}

services \
	'webui' =>	{
		serviceName: 'webui',
		selector: 'webui'
	},
	'auth' =>	{
		serviceName: 'auth',
		selector: 'auth'
	},
	'image' =>	{
		serviceName: 'image',
		selector: 'image'
	},
	'persistence' =>	{
		serviceName: 'persistence',
		selector: 'persistence'
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'webui',
		replicas: 1,
	},
	'app2' => {
		name: 'app2',
		selector: 'auth',
		replicas: 1,
	},
	'app3' => {
		name: 'app3',
		selector: 'image',
		replicas: 1,
	},
	'app4' => {
		name: 'app4',
		selector: 'persistence',
		replicas: 1,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    500.0 if general_stats.mean > 0.500
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['webui', 'persistence', 'auth', 'image'],
		targets: []
	}
]
