
# ragbench on a 3-cluster Liqo federation, for KubeTwin's multi-objective
# optimizer (bin/optimizer_optimuum: mean TTR, replica spreading, total
# replicas). Service times: the MDNs of examples/ragbench_bologna_mdn.conf
# (Bologna's baseline 1-RPS traces); every pod one single-threaded process,
# CPU limit one core, request 500m. Hops inside a cluster: the measured
# ragbench hop (2.17 +- 1.21 ms per leg). guardrail is left out, as in the
# other ragbench configs: it runs in parallel with the main chain and is
# much shorter, so its placement does not change the response time (it
# stays in cluster1 in the deployed allocations).
#
# Knobs (environment): RAGBENCH_RPS (default 4), RAGBENCH_SEED.
# Arrivals are constant-rate, like k6's constant-arrival-rate executor.
#
#   RAGBENCH_RPS=4 bundle exec ruby -Ilib bin/optimizer_optimuum examples/ragbench_3c.conf

ragbench_rps = (ENV['RAGBENCH_RPS'] || 4).to_f

start_time DateTime.civil(2020,5,28,0,0,0).to_time
# like a ragbench level: 30 s warm-up, 300 s measured
warmup_duration 30.seconds
cooldown_duration 10.seconds
duration 340.seconds
seeds communication_latencies: (ENV['RAGBENCH_SEED'] || 12345).to_i
stats_print_interval 1

seed (ENV['RAGBENCH_SEED'] || 12345).to_i

# Bologna's Liqo federation as in examples/bookinfo-3c-xr.conf: cluster1
# (where k6 enters, customer location 0) peered with two edge clusters;
# edge<->edge traffic is relayed by cluster1. Latency values are round-trip
# times (injected delays), KubeTwin uses half each way. TO CONFIRM with
# Bologna for the ragbench runs: cores per cluster, delays, jitter.
federation \
'{
	"resources": {
		"cluster1": {"cpu": "7000", "mem": "8192",
		             "nodes": [{"node": "cluster1", "cpu": "7000", "mem": "8192"}]},
		"cluster2edge": {"cpu": "7000", "mem": "8192",
		                 "nodes": [{"node": "cluster2edge", "cpu": "7000", "mem": "8192"}]},
		"cluster3edge": {"cpu": "7000", "mem": "8192",
		                 "nodes": [{"node": "cluster3edge", "cpu": "7000", "mem": "8192"}]}
	},
	"latencies": [
		{"src": "cluster1", "dst": "cluster2edge", "value": "0.030"},
		{"src": "cluster1", "dst": "cluster3edge", "value": "0.050"}
	],
	"intra_cluster_latency": {"mean": 0.00217, "sd": 0.00121},
	"inter_cluster_jitter_sd": 0.001,
	"min_latency": 0.0001
}'

customers \
	1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "gateway",
				calls: [
					{
						name: "embedder",
						calls: [
							{ name: "vector-search" }
						]
					},
					{ name: "reranker" },
					{ name: "llm-generate" }
				]
			}
		]
	}

request_gen \
	1 => {
		workflow_types: 1,
		starting_time: start_time,
		request_distribution: { distribution: :constant, args: { value: 1.0 / ragbench_rps } },
		num_requests: (ragbench_rps * 340).ceil,
		num_customers: 1
	}

# Gaussians below unused (mdn_file takes priority);
# each service draws from its own stream (seed + i);
# one process per pod (max_processes 1); CPU request 500 millicores
# (`--request-fraction 0.5`), limit one core
microservice_types \
	"gateway" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05635, sd: 0.00595, seed: seed + 0 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:mdn_file => "./mdn_models/ragbench_bologna_gateway_weights.json",
		:rps => 1,
		:use_configured_rps => true,
		:max_processes => 1,
	},
	"embedder" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.06688, sd: 0.00800, seed: seed + 1 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:mdn_file => "./mdn_models/ragbench_bologna_embedder_weights.json",
		:rps => 1,
		:use_configured_rps => true,
		:max_processes => 1,
	},
	"vector-search" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05339, sd: 0.00524, seed: seed + 2 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:mdn_file => "./mdn_models/ragbench_bologna_vector-search_weights.json",
		:rps => 1,
		:use_configured_rps => true,
		:max_processes => 1,
	},
	"reranker" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.08403, sd: 0.00609, seed: seed + 3 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:mdn_file => "./mdn_models/ragbench_bologna_reranker_weights.json",
		:rps => 1,
		:use_configured_rps => true,
		:max_processes => 1,
	},
	"llm-generate" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.15678, sd: 0.00879, seed: seed + 4 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:mdn_file => "./mdn_models/ragbench_bologna_llm-generate_weights.json",
		:rps => 1,
		:use_configured_rps => true,
		:max_processes => 1,
	}

services \
	'gateway' => { serviceName: 'gateway', selector: 'gateway' },
	'embedder' => { serviceName: 'embedder', selector: 'embedder' },
	'vector-search' => { serviceName: 'vector-search', selector: 'vector-search' },
	'reranker' => { serviceName: 'reranker', selector: 'reranker' },
	'llm-generate' => { serviceName: 'llm-generate', selector: 'llm-generate' }

replica_sets \
	'rs-gateway' => { name: 'rs-gateway', selector: 'gateway', replicas: 1 },
	'rs-embedder' => { name: 'rs-embedder', selector: 'embedder', replicas: 1 },
	'rs-vector-search' => { name: 'rs-vector-search', selector: 'vector-search', replicas: 1 },
	'rs-reranker' => { name: 'rs-reranker', selector: 'reranker', replicas: 1 },
	'rs-llm-generate' => { name: 'rs-llm-generate', selector: 'llm-generate', replicas: 1 }

evaluation \
cluster_hourly_cost: [
	{ cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
	500.0 if general_stats.mean > 1.000
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['gateway', 'embedder', 'vector-search', 'reranker', 'llm-generate'],
		targets: []
	}
]
