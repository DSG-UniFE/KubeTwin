
start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 30.seconds
seeds \
	{communication_latencies 12345}
stats_print_interval 1

seed 12345
 
federation \
'{
    "resources": {
        "europe-cloud-control-plane": {
            "cpu": "8000",
            "mem": "5984",
            "num_nodes": 1,
            "nodes": [
                {
                    "node": "europe-cloud-control-plane",
                    "cpu": "8000",
                    "mem": "5984"
                }
            ]
        }
    },
    "latencies": [
    ]
}'


customers \
    1 => { location_id: 0 }
    
workflow_types \
	1 => {
		component_sequence: [
			{ name: "productpage" },
			{ 
				type: "parallel",
				branches: [
					{ name: "reviews" },
					{ name: "details" }
				],
				wait_for: "all"
			},
			{ name: "ratings" }
		] 
	},
	2 => {
		component_sequence: [
			{ name: "productpage" },
			{ name: "details" },
			{ name: "reviews" },
			{ name: "ratings" }
		] 
	}

request_gen \
1 => {
    workflow_types: 2,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 30, seed: seed }},
    num_requests: 120_000,
    num_customers: 1
}


microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.9863, sigma: 0.4237, seed: seed}}, 
			:cloud=> {distribution: :lognorm, args: {mu: -4.9662, sigma: 0.2575, seed: seed}}
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		:max_processes=>8, # ProductPage handles UI rendering and multiple concurrent requests
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.7953, sigma: 0.6600, seed: seed}}, 
			:cloud=> {distribution: :lognorm, args: {mu: -6.3333, sigma: 0.4499, seed: seed}}
		},
		:resources_requirements_cpu=>400,
		:resources_requirements_memory=>100,
		:node_affinity=>"local", # at the moment is hardocoded
		:max_processes=>1, # Reviews handles review queries and aggregations
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -7.2518, sigma: 0.4921, seed: seed}}, 
			:cloud=> {distribution: :lognorm, args: {mu: -7.1250, sigma: 0.1583, seed: seed}}
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		:max_processes=>1, # Ratings increased to remove bottleneck
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -4.2602, sigma: 0.7735, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:gaussian, :args=>{:mean=>0.015, :sd=>0.0015, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		:max_processes=>8, # Details increased to test parallel behavior
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage' # the selector name is the same of the service name
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews' # the selector name is the same of the service name
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings' # the selector name is the same of the service name
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details' # the selector name is the same of the service name
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 1, # is randomly generated 1-3
	},
	'app2' => {
		name: 'app2',
		selector: 'reviews',
		replicas: 1, # is randomly generated 1-3
	},
	'app3' => {
		name: 'app3',
		selector: 'ratings',
		replicas: 1, # is randomly generated 1-3
	},
	'app4' => {
		name: 'app4',
		selector: 'details',
		replicas: 1, # is randomly generated 1-3
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :rome, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
    { cluster: :milan, fixed_cpu_hourly_cost: 0.300, fixed_memory_hourly_cost: 0.250 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    # 500$ penalties if MTTR takes more than 50 msecs
    500.0 if general_stats.mean > 0.500
}
    
