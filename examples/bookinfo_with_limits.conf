
# Bookinfo configuration matching the new Bologna dataset collected with
# realistic Kubernetes CPU requests/limits per container (see
# OPTIMUUM-estensioni/bookinfo_with_limits/kube/bookinfo_with_limits.yaml:
# productpage 200m->2000m, details 55m->1000m, ratings 10m->1000m,
# reviews 50m->2000m), single replica per service, 13 collected RPS levels
# (1,10,20,...,120).
#
# Not using `federation` here for the same reason as examples/teastore.conf:
# with a single resource and empty `latencies`, LatencyManagerFederation
# falls back to a hardcoded ~5ms "intra-dc" latency per hop, which doesn't
# match a real single-cluster deployment. clusters+latency_models lets us
# set that explicitly instead (near-zero, matching same-cluster pod-to-pod
# latency).
#
# bin/generate_bookinfo_rps_comparison sweeps all 13 RPS levels
# automatically via Configuration#set_rgen - no need to hand-edit :rate.

start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 10000.seconds
seeds communication_latencies: 12345
stats_print_interval 1

seed 12345

clusters \
	one: {
		name: "cluster1",
		location_id: 0,
		type: :mec,
		tier: "local",
		node_number: 1,
		node_resources_cpu: 8000,
		node_resources_memory: 31000,
	}

latency_models \
	[
		[
			{ distribution: :gaussian, args: { mean: 0.0005, sd: 0.0002 } },
		],
	]

customers \
    1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "productpage",
				calls: [
					{ name: "details" },
					{
						name: "reviews",
						calls: [
							{ name: "ratings" }
						]
					}
				]
			}
		]
	}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 40, seed: seed }},
    num_requests: 10_000,
    num_customers: 1
}

microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.0206, sigma: 0.6006, seed: seed}}, # unused, mdn_file takes priority
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:node_affinity=>"local",
		:mdn_file=>"./mdn_models/bookinfo_limits_productpage_weights.json",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -3.1469, sigma: 1.1626, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>100,
		:mdn_file=>"./mdn_models/bookinfo_limits_details_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.1976, sigma: 0.9960, seed: seed}},
		},
		:resources_requirements_cpu=>2000,
		:resources_requirements_memory=>300,
		:mdn_file=>"./mdn_models/bookinfo_limits_reviews_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.9735, sigma: 0.6140, seed: seed}},
		},
		:resources_requirements_cpu=>1000,
		:resources_requirements_memory=>50,
		:mdn_file=>"./mdn_models/bookinfo_limits_ratings_weights.json",
		:node_affinity=>"local",
		:rps_correction_factor=>1.0,
		:rps=>40,
		:max_processes=>8,
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage'
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details'
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews'
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings'
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 1,
	},
	'app2' => {
		name: 'app2',
		selector: 'details',
		replicas: 1,
	},
	'app3' => {
		name: 'app3',
		selector: 'reviews',
		replicas: 1,
	},
	'app4' => {
		name: 'app4',
		selector: 'ratings',
		replicas: 1,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    500.0 if general_stats.mean > 0.500
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['productpage', 'details', 'reviews', 'ratings'],
		targets: []
	}
]
