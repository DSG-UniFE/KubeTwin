
# ragbench on Bologna's cluster (2026-10-15 collection): one-pod ladder,
# every pod one single-threaded gunicorn process on one core (limit 1000m,
# request 500m: `--request-fraction 0.5`); a single k3s node with 8 cores
# (AMD EPYC 7413). Scenarios differ only in pods per service.
#
# Service times: one Gaussian per service, fitted (mean, sd) on the
# baseline's 1-RPS traces of that collection
# (data/baseline/traces_1RPS.json, 300 requests): the sum of each
# service's self segments (muBench compute_pi + framework). Hops: one
# Gaussian for every leg (request or response), fitted on the same traces
# (mean 2.17 ms over all legs).
#
# Topology as in examples/ragbench.conf: guardrail is left out (it runs in
# parallel with the ~380 ms embedder/reranker/llm-generate sequence and
# takes ~55 ms, so it never changes the response time).
#
# Knobs (environment): RAGBENCH_SCENARIO = baseline (default),
# baseline_repeat, gateway_2, gateway_3, gateway_4_llm_2; RAGBENCH_RPS
# (default 2); RAGBENCH_SEED (default 12345; pod choice is random and
# unseeded, so runs differ anyway). Arrivals are constant-rate, like k6's
# constant-arrival-rate executor.
#
#   bundle exec ruby -Ilib bin/kube_twin examples/ragbench_bologna.conf
#   RAGBENCH_RUNS=5 bundle exec ruby -Ilib bin/ragbench_comparison <data dir> examples/ragbench_bologna.conf

ragbench_rps = (ENV['RAGBENCH_RPS'] || 2).to_f
ragbench_replicas = {
	'gateway' => 1, 'embedder' => 1, 'vector-search' => 1,
	'reranker' => 1, 'llm-generate' => 1,
}
case ENV['RAGBENCH_SCENARIO'] || 'baseline'
when 'baseline', 'baseline_repeat' then nil
when 'gateway_2' then ragbench_replicas['gateway'] = 2
when 'gateway_3' then ragbench_replicas['gateway'] = 3
when 'gateway_4_llm_2'
	ragbench_replicas['gateway'] = 4
	ragbench_replicas['llm-generate'] = 2
else raise "unknown RAGBENCH_SCENARIO #{ENV['RAGBENCH_SCENARIO']}"
end

start_time DateTime.civil(2020,5,28,0,0,0).to_time
# like a ragbench level: 30 s warm-up, 300 s measured
warmup_duration 30.seconds
cooldown_duration 10.seconds
duration 340.seconds
seeds communication_latencies: (ENV['RAGBENCH_SEED'] || 12345).to_i
stats_print_interval 1

seed (ENV['RAGBENCH_SEED'] || 12345).to_i

clusters \
	one: {
		name: "cluster1",
		location_id: 0,
		type: :mec,
		tier: "local",
		node_number: 1,
		node_resources_cpu: 8000,
		node_resources_memory: 12000,
	}

latency_models \
	[
		[
			{ distribution: :gaussian, args: { mean: 0.00217, sd: 0.00121 } },
		],
	]

customers \
	1 => { location_id: 0 }

workflow_types \
	1 => {
		component_sequence: [
			{
				name: "gateway",
				calls: [
					{
						name: "embedder",
						calls: [
							{ name: "vector-search" }
						]
					},
					{ name: "reranker" },
					{ name: "llm-generate" }
				]
			}
		]
	}

request_gen \
	1 => {
		workflow_types: 1,
		starting_time: start_time,
		request_distribution: { distribution: :constant, args: { value: 1.0 / ragbench_rps } },
		num_requests: (ragbench_rps * 340).ceil,
		num_customers: 1
	}

# each service draws from its own stream (seed + i);
# one process per pod (max_processes 1); CPU request 500 millicores
# (`--request-fraction 0.5`), limit one core
microservice_types \
	"gateway" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05635, sd: 0.00595, seed: seed + 0 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"embedder" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.06688, sd: 0.00800, seed: seed + 1 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"vector-search" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.05339, sd: 0.00524, seed: seed + 2 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"reranker" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.08403, sd: 0.00609, seed: seed + 3 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	},
	"llm-generate" => {
		:service_time_distribution => {
			:mec => { distribution: :gaussian, args: { mean: 0.15678, sd: 0.00879, seed: seed + 4 } },
		},
		:resources_requirements_cpu => 500,
		:resources_requirements_memory => 128,
		:node_affinity => "local",
		:max_processes => 1,
	}

services \
	'gateway' => { serviceName: 'gateway', selector: 'gateway' },
	'embedder' => { serviceName: 'embedder', selector: 'embedder' },
	'vector-search' => { serviceName: 'vector-search', selector: 'vector-search' },
	'reranker' => { serviceName: 'reranker', selector: 'reranker' },
	'llm-generate' => { serviceName: 'llm-generate', selector: 'llm-generate' }

replica_sets \
	'rs-gateway' => { name: 'rs-gateway', selector: 'gateway', replicas: ragbench_replicas['gateway'] },
	'rs-embedder' => { name: 'rs-embedder', selector: 'embedder', replicas: ragbench_replicas['embedder'] },
	'rs-vector-search' => { name: 'rs-vector-search', selector: 'vector-search', replicas: ragbench_replicas['vector-search'] },
	'rs-reranker' => { name: 'rs-reranker', selector: 'reranker', replicas: ragbench_replicas['reranker'] },
	'rs-llm-generate' => { name: 'rs-llm-generate', selector: 'llm-generate', replicas: ragbench_replicas['llm-generate'] }

evaluation \
cluster_hourly_cost: [
	{ cluster: :cluster1, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
	500.0 if general_stats.mean > 1.000
}

policies [
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 5000},
		chains: ['gateway', 'embedder', 'vector-search', 'reranker', 'llm-generate'],
		targets: []
	}
]
