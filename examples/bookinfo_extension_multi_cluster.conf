
start_time DateTime.civil(2020,5,28,0,0,0).to_time
warmup_duration 10.seconds
cooldown_duration 10.seconds

duration 100000.seconds
seeds \
	{communication_latencies 12345}
stats_print_interval 1

seed 12345
 
federation \
'{
    "resources": {
        "europe-cloud-control-plane": {
            "cpu": "8000",
            "mem": "5984",
            "num_nodes": 1,
            "nodes": [
                {
                    "node": "europe-cloud-control-plane",
                    "cpu": "8000",
                    "mem": "5984"
                }
            ]
        },
        "europe-rome-edge": {
            "cpu": "4000",
            "mem": "8192"
        },
        "europe-milan-edge": {
            "cpu": "4000",
            "mem": "8192"
        },
        "europe-paris-edge": {
            "cpu": "6000",
            "mem": "8192"
        },
        "europe-berlin-edge": {
            "cpu": "4000",
            "mem": "4096"
        },
        "europe-madrid-edge": {
            "cpu": "4000",
            "mem": "4096"
        },
        "europe-athens-edge": {
            "cpu": "2000",
            "mem": "4096"
        }
    },
    "latencies": [
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-rome-edge",
            "value": "1.416000"
        },
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-milan-edge",
            "value": "0.477000"
        },
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-paris-edge",
            "value": "0.312000"
        },
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-berlin-edge",
            "value": "0.638000"
        },
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-madrid-edge",
            "value": "1.872000"
        },
        {
            "src": "europe-cloud-control-plane",
            "dst": "europe-athens-edge",
            "value": "2.214000"
        }
    ]
}'


customers \
    1 => { location_id: 0 }
    
workflow_types \
	1 => {
		component_sequence: [
			{ name: "productpage" },
			{ name: "reviews" },
			{ name: "ratings" },
		] 
	}#,
	#2 => {
	#	component_sequence: [
	#		{ name: "reviews" },
	#		{ name: "ratings" },
	#	] 
	#}

request_gen \
1 => {
    workflow_types: 1,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 25, seed: seed }},
    num_requests: 10000,
    num_customers: 1
}
=begin
2 => {
    workflow_types: 2,
    starting_time: start_time,
    request_distribution: {distribution: :exponential, args: { rate: 300, seed: seed }},
    num_requests: 10000,
    num_customers: 1
}
=end

microservice_types \
	"productpage" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -4.2489, sigma: 0.3402, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-4.2489, :sigma=>0.3402, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"reviews" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -6.257, sigma: 0.4655, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-6.257, :sigma=>0.4655, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>400,
		:resources_requirements_memory=>100,
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"ratings" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -7.3997, sigma: 0.3673, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-7.3997, :sigma=>0.3673, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	},
	"details" =>	{
		:service_time_distribution=>{
			:mec=> {distribution: :lognorm, args: {mu: -5.6966, sigma: 0.6175, seed: seed}}, # at the moment is hardocoded
			:cloud=>{:distribution=>:lognorm, :args=>{:mu=>-5.6966, :sigma=>0.6175, :seed=>12345}} # at the moment is hardocoded
		},
		:resources_requirements_cpu=>200,
		:resources_requirements_memory=>40,
		:node_affinity=>"local", # at the moment is hardocoded
		# :mdn_file=>"placeholder!!!", # write the path of your model
		:rps=>100, # at the moment is hardcode (change if is necessary)
	}

services \
	'productpage' =>	{
		serviceName: 'productpage',
		selector: 'productpage' # the selector name is the same of the service name
	},
	'reviews' =>	{
		serviceName: 'reviews',
		selector: 'reviews' # the selector name is the same of the service name
	},
	'ratings' =>	{
		serviceName: 'ratings',
		selector: 'ratings' # the selector name is the same of the service name
	},
	'details' =>	{
		serviceName: 'details',
		selector: 'details' # the selector name is the same of the service name
	}

replica_sets \
	'app1' => {
		name: 'app1',
		selector: 'productpage',
		replicas: 3,
	},
	'app2' => {
		name: 'app2',
		selector: 'reviews',
		replicas: 3,
	},
	'app3' => {
		name: 'app3',
		selector: 'ratings',
		replicas: 3,
	},
	'app4' => {
		name: 'app4',
		selector: 'details',
		replicas: 3,
	}

evaluation \
cluster_hourly_cost: [
    { cluster: :cloud_control_plane, fixed_cpu_hourly_cost: 0.080, fixed_memory_hourly_cost: 0.070 },
    { cluster: :rome, fixed_cpu_hourly_cost: 0.100, fixed_memory_hourly_cost: 0.100 },
    { cluster: :milan, fixed_cpu_hourly_cost: 0.120, fixed_memory_hourly_cost: 0.100 },
    { cluster: :paris, fixed_cpu_hourly_cost: 0.110, fixed_memory_hourly_cost: 0.090 },
    { cluster: :berlin, fixed_cpu_hourly_cost: 0.130, fixed_memory_hourly_cost: 0.110 },
    { cluster: :madrid, fixed_cpu_hourly_cost: 0.150, fixed_memory_hourly_cost: 0.120 },
    { cluster: :athens, fixed_cpu_hourly_cost: 0.170, fixed_memory_hourly_cost: 0.140 },
],

penalties: lambda {|general_stats, per_workflow_and_customer_stats|
    # 500$ penalties if MTTR takes more than 50 msecs
    500.0 if general_stats.mean > 0.500
}
    
policies [
	# Policy: optimize_productpage_chain (type: torch.policies.Placement.ServiceChainResponseTime)
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 3000},
		chains: ['productpage', 'reviews', 'ratings'],
		targets: []
	},
	# Policy: optimize_reviews_chain (type: torch.policies.Placement.ServiceChainResponseTime)
	{
		type: 'torch.policies.Placement.ServiceChainResponseTime',
		properties: {'service_chain_max_latency_ms': 2500},
		chains: ['reviews', 'ratings'],
		targets: []
	},
	# Policy: required_availability (type: torch.policies.ApplicationService.Performance.Availability)
	{
		type: 'torch.policies.ApplicationService.Performance.Availability',
		properties: {'target_availability_percentage': 99.999},
		targets: []
	}
]

